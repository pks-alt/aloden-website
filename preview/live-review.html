<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aloden — Live Homepage Content Review</title>
<style>
html,body{margin:0;min-height:100%;background:#fff}
#loading{position:fixed;inset:0;display:grid;place-items:center;font:500 15px system-ui;color:#3d4552;background:#fff;z-index:9999}
</style>
</head>
<body>
<div id="loading">Loading Aloden live content review…</div>
<script>
(async()=>{
  try{
    const bust='?v='+Date.now();
    const html=await fetch('index.html'+bust,{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error('Base page '+r.status);
      return r.text();
    });
    const doc=new DOMParser().parseFromString(html,'text/html');
    const marker=doc.createElement('meta');
    marker.name='aloden-content-review';
    marker.content='live';
    doc.head.appendChild(marker);
    const scripts=['review-patch.js','review-philosophy.js','review-insight.js','review-trust.js','review-cta.js'];
    scripts.forEach(src=>{
      const s=doc.createElement('script');
      s.src=src+bust;
      doc.body.appendChild(s);
    });
    document.open();
    document.write('<!doctype html>'+doc.documentElement.outerHTML);
    document.close();
  }catch(e){
    document.getElementById('loading').textContent='Unable to load live review: '+e.message;
  }
})();
</script>
</body>
</html>
