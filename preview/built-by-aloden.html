<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
iframe{display:block;width:100%;height:100vh;border:0;background:#fff}
.fallback{position:absolute;left:-9999px}
</style>
</head>
<body>
<iframe id="work-frame" src="reviews/our-work-final-v11.html" title="Aloden Our Work"></iframe>
<noscript><p class="fallback"><a href="reviews/our-work-world-class-v9.html">View Aloden Our Work</a></p></noscript>
<script>
(() => {
  const outer = document.getElementById('work-frame');
  const aliases = {
    products: 'work',
    work: 'work',
    medlivo: 'medlivo',
    'medlivo-proof': 'medlivo',
    startupfair: 'startupfair',
    'startupfair-proof': 'startupfair',
    voice: 'voice',
    'voice-ai-proof': 'voice'
  };

  function requestedTarget() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, '')).trim();
    return aliases[raw] || raw || '';
  }

  function scrollInnerPage() {
    const targetId = requestedTarget();
    if (!targetId) return;
    try {
      const reviewDoc = outer.contentDocument;
      const inner = reviewDoc?.getElementById('reviewFrame');
      if (!inner) return;
      const scroll = () => {
        try {
          const target = inner.contentDocument?.getElementById(targetId);
          if (target) target.scrollIntoView({ block: 'start' });
        } catch (_) { /* same-origin review frame expected */ }
      };
      if (inner.contentDocument?.readyState === 'complete') window.setTimeout(scroll, 60);
      inner.addEventListener('load', () => window.setTimeout(scroll, 60), { once: true });
    } catch (_) { /* preserve the approved page even if deep-link forwarding is unavailable */ }
  }

  outer.addEventListener('load', scrollInnerPage);
  window.addEventListener('hashchange', scrollInnerPage);
})();
</script>
</body>
</html>
