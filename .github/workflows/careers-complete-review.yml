name: Complete Careers review
on:
  push:
    branches: [feature/careers-page]
    paths: ['.github/workflows/careers-complete-review.yml']
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: complete-careers-review
  cancel-in-progress: false
jobs:
  finish:
    if: github.ref == 'refs/heads/feature/careers-page'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate the checksum-verified review source
        run: |
          mkdir -p qa-artifacts
          git merge-base --is-ancestor a136d11d128acb9aced943c5fe19b022b3992ff8 HEAD
          echo '26c774902292ae3359e85ab2c801e975a20bfdd1539c352ac567bbaf88d3e736  scripts/careers-integration-a.patch' | sha256sum -c -
          echo '2c0bbc32fd4b63ec2964e8b3e8a1317992a970c5b169c5490bd36426a1e15a4f  scripts/careers-integration-b.patch' | sha256sum -c -
          python3 - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          encoded=Path('scripts/careers-completion.b64').read_text().strip()
          repairs={'J5oikoikoY':'J5oikoY','GtCpIbkhTHB':'GtCpIbknTHB','YUpsNbXhzPT':'YUpsNbXxzPT','S97c2H/f72+':'S97c2H/hf72+','LTbHPB1+fesMv6Wg':'LTbHPB1+XMv6Wg','YenWGmB0nh':'YenWGm07nh'}
          for old,new in repairs.items(): encoded=encoded.replace(old,new)
          source=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(source).hexdigest()=='6008fda3184c07ac94ace3910dd2e05482f3365a195708f58b41917d4f298009'
          Path('/tmp/aloden-completion.py').write_bytes(source)
          PY
          git apply --check --unidiff-zero scripts/careers-integration-a.patch scripts/careers-integration-b.patch
          git apply --unidiff-zero scripts/careers-integration-a.patch scripts/careers-integration-b.patch
          python3 /tmp/aloden-completion.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/careers-job-previews.mjs')
          s=p.read_text()
          old="renderRole(template,job,'https://www.aloden.com',{review:true,base:'../../'}));"
          new="renderRole(template,job,'https://www.aloden.com',{review:true,base:'../../'}).replace(/[\\t ]+$/gm,''));"
          assert old in s
          p.write_text(s.replace(old,new))
          PY
          node scripts/careers-job-previews.mjs
          node scripts/site-qa.mjs
          node --check preview/careers-jobs.js
          node --check preview/hr-jobs.js
          node --check preview/careers-application.js
          node --test server/careers/careers.test.mjs server/careers/jobs.test.mjs | tee qa-artifacts/backend-tests.txt
          node --test server/project-brief-handler.test.mjs | tee qa-artifacts/project-tests.txt
          git diff --exit-code a136d11d128acb9aced943c5fe19b022b3992ff8 -- preview/index.html preview/homepage* preview/assets preview/app.js preview/start-project.html preview/built-by-aloden.html
      - name: Browser journeys and screenshots
        run: |
          npm install --prefix /tmp/aloden-browser --no-audit --no-fund playwright@1.56.1
          /tmp/aloden-browser/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 --directory preview >/tmp/aloden-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/careers.html >/dev/null && break || sleep 1; done
          node scripts/careers-browser-qa.mjs | tee qa-artifacts/careers-browser-tests.txt
          node scripts/careers-jobs-browser-qa.mjs | tee qa-artifacts/jobs-browser-tests.txt
      - name: Commit tested source to the review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin refs/heads/feature/careers-page | cut -f1)" = "$GITHUB_SHA"
          rm scripts/careers-completion.b64
          # Workflow maintenance is performed separately through the authorized connector.
          # The Actions token commits application source only, within contents permission.
          git restore --source=HEAD --worktree .github
          git add -A
          git diff --cached --check
          git diff --cached --exit-code -- .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finish Careers with the five image roles, job-linked applications, and verified HR publishing'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feature/careers-page
      - name: Package exact reviewed commit and reports
        if: always()
        run: |
          mkdir -p qa-artifacts
          git rev-parse HEAD > qa-artifacts/COMMIT.txt
          git status --short > qa-artifacts/WORKTREE.txt
          git archive --format=zip --output=qa-artifacts/reviewed-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: careers-completion-${{ github.sha }}
          path: qa-artifacts/
          retention-days: 7
