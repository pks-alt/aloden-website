name: Verify public website polish
on:
  push:
    branches: [feature/content-consistency-review]
    paths: ['.github/workflows/public-polish-integrate.yml']
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply scoped public repairs
        run: |
          mkdir -p qa-artifacts /tmp/aloden-content-baseline
          git archive 2a75456f481d381e8e4ebbb89ce3191fd54c20c8 | tar -x -C /tmp/aloden-content-baseline
          python3 scripts/finish-public-review.py
          node scripts/careers-job-previews.mjs
          node scripts/site-qa.mjs
          node --check preview/app.js
          node --check preview/careers-jobs.js
          node --check preview/careers-application.js
          node --check preview/start-project-form.js
          node --test server/careers/careers.test.mjs server/careers/jobs.test.mjs | tee qa-artifacts/backend-tests.txt
          node --test server/project-brief-handler.test.mjs | tee qa-artifacts/project-tests.txt
          git diff --exit-code 5b8bb6deff663fbf15f7a0c8649db195ce9e0c82 -- preview/assets preview/data server ':(exclude)server/careers/jobs-api.mjs'
          git diff --check
      - name: Verify every public page and application journeys
        run: |
          npm install --prefix /tmp/aloden-browser --no-audit --no-fund playwright@1.56.1
          /tmp/aloden-browser/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 --directory preview >/tmp/current.log 2>&1 &
          A=$!
          python3 -m http.server 8766 --bind 127.0.0.1 --directory /tmp/aloden-content-baseline/preview >/tmp/baseline.log 2>&1 &
          B=$!
          trap 'kill "$A" "$B"' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break || sleep 1; done
          node scripts/public-polish-qa.mjs
          node scripts/content-consistency-qa.mjs
          node scripts/careers-browser-qa.mjs
          node scripts/careers-jobs-browser-qa.mjs
      - name: Commit only tested public repairs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin refs/heads/feature/content-consistency-review | cut -f1)" = "$GITHUB_SHA"
          git rm scripts/finish-public-review.py
          git add preview docs/ALODEN-OFFICIAL-LOGO.md scripts/careers-browser-qa.mjs server/careers/jobs-api.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix the Aloden hero logo, remove internal public copy, and clarify contact and application routes'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feature/content-consistency-review
      - name: Package reviewed source and visual evidence
        if: always()
        run: |
          mkdir -p qa-artifacts
          git rev-parse HEAD > qa-artifacts/COMMIT.txt
          git status --short > qa-artifacts/WORKTREE.txt
          git archive --format=zip --output=qa-artifacts/reviewed-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-polish-${{ github.sha }}
          path: qa-artifacts/
          retention-days: 7
