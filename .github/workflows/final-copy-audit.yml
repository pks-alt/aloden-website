name: Final Public Copy Audit
on:
  push:
    branches: [feature/final-public-content-cleanup]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit public copy and runtime fallback wording
        run: node scripts/final-copy-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: final-copy-audit-${{ github.sha }}
          path: qa-artifacts/final-copy-audit.md
          retention-days: 2
