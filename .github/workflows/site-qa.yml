name: Aloden V2 Site QA

on:
  push:
    branches:
      - feature/final-site-redesign
      - develop
      - main
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check preview/app.js
          node --check preview/start-project-form.js
          node --check server/project-brief-handler.mjs
      - name: Audit pages, links, resources, metadata, and form structure
        run: node scripts/site-qa.mjs
      - name: Test secure project-brief handler
        run: node --test server/project-brief-handler.test.mjs
